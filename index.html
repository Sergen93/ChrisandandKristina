<script>
class DCLogic { constructor() { this.state = {}; this.props = {}; } setState(o) { Object.assign(this.state, o); render(); } }

class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
clearInterval(this.musicTimer);
try { if (this.ctx) this.ctx.close(); } catch (e) {}
}
freq(name) {
const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const sharp = name.charAt(1) === '#';
const octave = parseInt(name.slice(sharp ? 2 : 1), 10);
const midi = 12 * (octave + 1) + semis[name.charAt(0)] + (sharp ? 1 : 0);
return 440 * Math.pow(2, (midi - 69) / 12);
}
note(name, t, vol, dur) {
const f = this.freq(name);
const parts = [[1, 1, dur], [1.0023, 0.5, dur], [2, 0.4, dur * 0.7], [3, 0.2, dur * 0.5], [4, 0.1, dur * 0.35], [5, 0.05, dur * 0.25]];
for (let i = 0; i < parts.length; i++) {
const osc = this.ctx.createOscillator();
const g = this.ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(f * parts[i][0], t);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(vol * parts[i][1], t + 0.014);
g.gain.exponentialRampToValueAtTime(0.0001, t + parts[i][2]);
osc.connect(g);
g.connect(this.master);
osc.start(t);
osc.stop(t + parts[i][2] + 0.05);
}
}
playStep(s, t) {
const arps = [['D3', 'A3', 'D4', 'F4', 'A4', 'F4', 'D4', 'A3'], ['A#2', 'F3', 'A#3', 'D4', 'F4', 'D4', 'A#3', 'F3'], ['F2', 'C3', 'F3', 'A3', 'C4', 'A3', 'F3', 'C3'], ['C3', 'G3', 'C4', 'E4', 'G4', 'E4', 'C4', 'G3']];
const lines = [
'A4 - - - D5 - E5 - F5 - - - D5 - - - C5 - - - F5 - G5 - E5 - - - - - D5 -',
'A5 - - G5 F5 - E5 - D5 - - - F5 - A#5 - A5 - - G5 F5 - C5 - E5 - - - D5 - C5 -',
'D5 - F5 - A5 - D6 - D6 - - A#5 F5 - D5 - C5 - F5 - A5 - C6 - C6 - - B5 G5 - E5 -'
];
const pass = Math.floor(s / 32);
const inPass = s % 32;
const c = Math.floor(inPass / 8);
const k = inPass % 8;
this.note(arps[c][k], t, k === 0 ? 0.2 : 0.1, k === 0 ? 5 : 3);
const m = lines[pass].split(' ')[inPass];
if (m !== '-') this.note(m, t, pass === 2 ? 0.2 : 0.22, 4.5);
if (pass === 2 && k === 0) this.note(arps[c][2], t, 0.14, 5);
}
schedule() {
if (!this.ctx) return;
const now = this.ctx.currentTime;
if (this.nextT < now) this.nextT = now + 0.05;
while (this.nextT < now + 0.5) {
this.playStep(this.step, this.nextT);
this.nextT += 0.5;
this.step = (this.step + 1) % 96;
}
}
startMusic() {
try {
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
if (!this.ctx) {
this.ctx = new AC();
this.master = this.ctx.createGain();
const soft = this.ctx.createBiquadFilter();
soft.type = 'lowpass';
soft.frequency.value = 3600;
this.master.connect(soft);
soft.connect(this.ctx.destination);
const rate = this.ctx.sampleRate;
const len = Math.floor(rate * 3);
const hall = this.ctx.createBuffer(2, len, rate);
for (let ch = 0; ch < 2; ch++) {
const data = hall.getChannelData(ch);
for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
}
const verb = this.ctx.createConvolver();
verb.buffer = hall;
const wet = this.ctx.createGain();
wet.gain.value = 0.32;
soft.connect(verb);
verb.connect(wet);
wet.connect(this.ctx.destination);
}
if (this.ctx.state === 'suspended') this.ctx.resume();
const now = this.ctx.currentTime;
const muted = !!(this.state || {}).muted;
this.master.gain.cancelScheduledValues(now);
this.master.gain.setValueAtTime(muted ? 0 : 0.42, now);
this.step = 0;
this.nextT = now + 0.9;
clearInterval(this.musicTimer);
this.musicTimer = setInterval(() => this.schedule(), 100);
} catch (e) {}
}
stopMusic() {
clearInterval(this.musicTimer);
try { if (this.ctx) this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.08); } catch (e) {}
}
toggleMute() {
const muted = !(this.state || {}).muted;
this.setState({ muted: muted });
try { if (this.ctx) this.master.gain.setTargetAtTime(muted ? 0 : 0.42, this.ctx.currentTime, 0.05); } catch (e) {}
}
renderVals() {
const s = this.state || {};
const target = Date.UTC(2027, 7, 27, 14, 0, 0);
const left = Math.max(0, target - (s.now || Date.now()));
const total = Math.floor(left / 1000);
const pad = (n) => (n < 10 ? '0' + n : '' + n);
return {
ground: '#A6B39A',
opened: !!s.opened,
closed: !s.opened,
open: () => { this.setState({ opened: true }); this.startMusic(); },
close: () => { this.setState({ opened: false }); this.stopMusic(); },
toggleMute: () => this.toggleMute(),
soundLabel: s.muted ? 'Unmute music' : 'Mute music',
muted: !!s.muted,
unmuted: !s.muted,
days: '' + Math.floor(total / 86400),
hours: pad(Math.floor((total % 86400) / 3600)),
mins: pad(Math.floor((total % 3600) / 60)),
secs: pad(total % 60)
};
}
}

var card = new Component();
function $(id) { return document.getElementById(id); }
function render() {
var v = card.renderVals();
$('closed').style.display = v.closed ? 'block' : 'none';
$('opened').style.display = v.opened ? 'block' : 'none';
$('ic-on').style.display = v.unmuted ? 'flex' : 'none';
$('ic-off').style.display = v.muted ? 'flex' : 'none';
$('btn-mute').setAttribute('aria-label', v.soundLabel);
$('cd-d').textContent = v.days; $('cd-h').textContent = v.hours; $('cd-m').textContent = v.mins; $('cd-s').textContent = v.secs;
}
$('btn-open').addEventListener('click', function () { card.renderVals().open(); });
$('btn-close').addEventListener('click', function () { card.renderVals().close(); });
$('btn-mute').addEventListener('click', function () { card.renderVals().toggleMute(); });
function fit() { var s = Math.min(window.innerWidth / 600, window.innerHeight / 840); document.getElementById('fit').style.setProperty('--s', s); }
var track = new Audio(); track.loop = true; track.preload = 'none'; track.volume = 0.75;
var hasTrack = false;
try { fetch('music.mp3', { method: 'HEAD' }).then(function (r) { if (r.ok) { hasTrack = true; track.src = 'music.mp3'; track.preload = 'auto'; track.load(); } }).catch(function () {}); } catch (e) {}
var synthStart = card.startMusic.bind(card), synthStop = card.stopMusic.bind(card), synthMute = card.toggleMute.bind(card);
card.startMusic = function () { if (hasTrack) { try { track.currentTime = 0; } catch (e) {} track.muted = !!card.state.muted; var p = track.play(); if (p && p.catch) p.catch(function () {}); } else synthStart(); };
card.stopMusic = function () { track.pause(); synthStop(); };
card.toggleMute = function () { synthMute(); track.muted = !!card.state.muted; };
window.addEventListener('resize', fit); fit();
card.componentDidMount(); render();
</script>
</body>
