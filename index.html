*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#A6B39A;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;left:0;top:0;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;color:#3F4A3A;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
p,h1{margin:0;font-weight:400}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #2F3A2C;outline-offset:3px}

#bg{position:fixed;left:0;top:0;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 38%,#B8C4AC 0%,#A6B39A 46%,#8D9C82 100%)}
#bg::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background-image:var(--noise);background-size:96px 96px}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#cv-back{z-index:1}
#cv-front{z-index:5}
#fit{position:fixed;left:50%;top:50%;width:540px;height:960px;z-index:2;transform:translate(-50%,-50%) scale(var(--s,1));opacity:0;transition:opacity .8s ease}
#fit.ready{opacity:1}
#tilt{position:absolute;left:0;top:0;width:540px;height:960px}
#stage{position:absolute;left:0;top:0;width:540px;height:960px}

/* closed screen */
.c-title{position:absolute;left:0;top:226px;width:540px;text-align:center;z-index:5;transition:opacity .35s ease}
.c-title .nm{font-size:19px;font-weight:600;letter-spacing:9px;padding-left:9px;text-transform:uppercase;color:#2F3A2C}
.c-title .orn{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:16px}
.c-title .orn i{display:block;width:58px;height:1px;background:rgba(47,58,44,.5)}
.c-title .orn b{display:block;width:6px;height:6px;transform:rotate(45deg);background:#2F3A2C}
.c-hint{position:absolute;left:0;top:666px;width:540px;text-align:center;z-index:5;font-size:21px;font-style:italic;color:#2F3A2C;transition:opacity .3s ease}
.c-hint span{display:inline-block;animation:hint 2.8s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:1}50%{opacity:.62}}
.open .c-title,.open .c-hint,.closing .c-title,.closing .c-hint{opacity:0}

.envgrp{position:absolute;left:50px;top:334px;width:440px;height:290px}
#envA{z-index:1}
#envB{z-index:4}
.bob{position:absolute;left:0;top:0;width:440px;height:290px;perspective:1100px;perspective-origin:50% 20%;animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.open .bob,.closing .bob{animation-play-state:paused}
.env-shadow{position:absolute;left:8px;top:12px;width:424px;height:274px;border-radius:10px;box-shadow:0 36px 52px -10px rgba(40,52,38,.5),0 10px 18px rgba(40,52,38,.22)}
.envgrp svg{position:absolute;left:0;top:0;display:block;overflow:visible}
.flapF,.flapL{transform-origin:50% 0}
.flapF{filter:drop-shadow(0 2px 2.5px rgba(70,60,40,.3))}
.flapL{opacity:0}
.seal{position:absolute;left:178px;top:124px;width:84px;height:84px;filter:drop-shadow(0 3px 3px rgba(80,40,46,.38))}

/* ---------- layout ---------- */

}
window.addEventListener('resize', resize);
resize();

/* ---------- music ---------- */
var Synth = (function () {

/* ---------- petals and sparkles ---------- */

var GOLD = ['#EAD6A8', '#D4B06A', '#F7EDCF', '#C9A86A'];

}

}
function burstPetal(x, y, vx, vy, life, front) {

  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.fall = rnd(60, 105); p.size *= 1.15; p.a = front ? 0.85 : 0.95;
  p.front = front; p.max = life; p.vr = rnd(-2.4, 2.4);

function spark(x, y, speed, up, k) {

}
function star(g, r) {

  g.quadraticCurveTo(0, 0, -r, 0); g.quadraticCurveTo(0, 0, 0, -r); g.fill();

var ptr = { x: 0, y: 0, t: -9999, acc: 0 }, tilt = { x: 0, y: 0, tx: 0, ty: 0, on: false, last: '' };
var gyro = { x: 0, y: 0, t: -9999, g0: null, b0: null };
var unrollA = 0, unrollB = 0, roller = $('roller'), last = 0, T = 0;

  for (i = sparks.length - 1; i >= 0; i--) {

/* ---------- touch and mouse ---------- */
var lastTouch = -9999;
function pMove(x, y) {

  if (now - ptr.t < 300) { var dx = x - ptr.x, dy = y - ptr.y; ptr.acc += Math.sqrt(dx * dx + dy * dy); } else ptr.acc = 0;

  if (!reduce) { var n = 0; while (ptr.acc > 26 && n < 4) { ptr.acc -= 26; n++; spark(x + rnd(-6, 6), y + rnd(-6, 6), 26, 0); } }
}
function pDown(x, y) {
  ptr.x = x; ptr.y = y; ptr.t = performance.now(); ptr.acc = 0;

}
function pEnd() { tilt.on = false; }
document.addEventListener('touchstart', function (e) { lastTouch = performance.now(); var t = e.touches[0]; if (t) pDown(t.clientX, t.clientY); }, { passive: true });
document.addEventListener('touchmove', function (e) {

}, { passive: false });
document.addEventListener('touchend', pEnd, { passive: true });
document.addEventListener('touchcancel', pEnd, { passive: true });
document.addEventListener('mousemove', function (e) { if (performance.now() - lastTouch > 900) pMove(e.clientX, e.clientY); });

document.documentElement.addEventListener('mouseleave', pEnd);
window.addEventListener('deviceorientation', function (e) {
  if (e.gamma === null || e.beta === null || e.gamma === undefined) return;
  if (gyro.g0 === null) { gyro.g0 = e.gamma; gyro.b0 = e.beta; }
  gyro.g0 += (e.gamma - gyro.g0) * 0.012; gyro.b0 += (e.beta - gyro.b0) * 0.012;
  gyro.x = Math.max(-1, Math.min(1, (e.gamma - gyro.g0) / 12));
  gyro.y = Math.max(-1, Math.min(1, (e.beta - gyro.b0) / 12));
  gyro.t = performance.now();
});

/* ---------- open and close ---------- */
function later(ms, fn) { return setTimeout(fn, reduce ? Math.min(ms, 60) : ms); }
function sealBurst() {
  if (reduce) return;
  var r = document.querySelector('.seal').getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (var i = 0; i < 34; i++) spark(x + rnd(-8, 8) * S, y + rnd(-8, 8) * S, 250 * Math.max(0.7, S), 40);
}
function petalBurst() {
  if (reduce) return;

  for (var i = 0; i < 16; i++) {

  }
}
function openIt() {

}

  calMenu.classList.remove('show');

  stage.classList.remove('open');

$('btn-open').addEventListener('click', openIt);
$('btn-close').addEventListener('click', closeIt);
$('btn-mute').addEventListener('click', function () {
  var m = Music.toggle();
  $('ic-on').style.display = m ? 'none' : 'flex';
  $('ic-off').style.display = m ? 'flex' : 'none';
  this.setAttribute('aria-label', m ? 'Unmute music' : 'Mute music');

/* ---------- calendar: straight to the right app where the device is known ---------- */
var calBtn = $('btn-cal'), calMenu = $('calmenu');
var ua = navigator.userAgent || '';
var isAndroid = /Android/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var iosSafari = isIOS && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|FB_IAB|Instagram|Line\//.test(ua);

} else if (!iosSafari) {

  calBtn.addEventListener('click', function (e) { e.preventDefault(); showMenu(!calMenu.classList.contains('show')); });
  document.addEventListener('click', function (e) { if (!calMenu.contains(e.target) && !calBtn.contains(e.target)) showMenu(false); });

var garland = $('garland');
garland.addEventListener('click', function () {
  garland.classList.remove('rebloom'); void garland.offsetWidth; garland.classList.add('rebloom');
  if (reduce) return;
  var r = garland.getBoundingClientRect(), k = Math.max(0.7, S);

/* ---------- countdown ---------- */
var target = Date.UTC(2027, 7, 27, 14, 0, 0);

var started = false;

})();
